[package]
name = "Solana-transaction-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-address = "2.8"
solana-keypair = "4.0"
solana-message = "5.1"
solana-signature = "3.6"
solana-system-interface = { version = "3.3", features = ["bincode"] }
solana-transaction = { version = "5.1", features = ["serde"] }
